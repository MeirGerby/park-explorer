# Overrides the nginx.web.conf baked into the web image: the image's default
# proxy_pass target ("api", the Docker Compose service name) doesn't resolve
# in the cluster, so this ConfigMap points it at the real Service DNS name.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "park-explorer.webServiceName" . }}-nginx
  labels:
    {{- include "park-explorer.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
data:
  default.conf: |
    server {
        listen {{ .Values.web.containerPort }};
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location /trpc {
            proxy_pass http://{{ include "park-explorer.apiServiceName" . }}:{{ .Values.api.containerPort }}/trpc;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
