{{- $secretName := include "park-explorer.postgresSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := "" -}}
{{- if $existing -}}
{{- $password = index $existing.data "postgres-password" | b64dec -}}
{{- else -}}
{{- $password = .Values.postgresql.auth.password | default (randAlphaNum 24) -}}
{{- end -}}
{{- $databaseUrl := printf "postgresql://%s:%s@%s:5432/%s" .Values.postgresql.auth.user $password (include "park-explorer.postgresServiceName" .) .Values.postgresql.auth.database -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "park-explorer.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
stringData:
  postgres-user: {{ .Values.postgresql.auth.user | quote }}
  postgres-password: {{ $password | quote }}
  postgres-database: {{ .Values.postgresql.auth.database | quote }}
  # Convenience: the api and migrate initContainer just mount this one key
  # rather than reassembling the URL from the three fields above.
  database-url: {{ $databaseUrl | quote }}
